<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
<title id="title">FACT Indonesia purchase and entitlement sequence</title><desc id="desc">Conceptual purchase flow with Next.js checkout, Go API, PostgreSQL and an unselected payment provider. Server pricing, stable idempotency keys, authenticated notifications and an atomic paid-state plus entitlement transaction precede course access.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192125"/><stop offset=".6" stop-color="#101416"/><stop offset="1" stop-color="#151A1C"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#829398" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#EDC576" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="1320" rx="24" fill="url(#background)" stroke="none"/>
<rect x="1" y="1" width="1598" height="1318" rx="24" fill="none" stroke="#38464C"/>
<path d="M71 57 L78 64 L71 71 L64 64Z" fill="#EDC576"/>
<text x="92" y="72" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="2.4">FACT / INDONESIA</text>
<text x="1536" y="72" fill="#B7C2C5" font-family="Consolas, monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="1.6">SYSTEM ATLAS / 02</text>
<text x="64" y="158" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="600" text-anchor="start" letter-spacing="-2.2">From intent to access.</text>
<text x="66" y="205" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">One authoritative purchase state, from quote to enrollment.</text>
<path d="M64 246 H1536" fill="none" stroke="#38464C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 246 H248" fill="none" stroke="#EDC576" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="292" width="308" height="106" rx="10" fill="#171D20" stroke="#38464C"/>
<text x="244" y="326" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Learner interface</text>
<text x="244" y="368" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="-0.6">Next.js</text>
<path d="M244 398 V1152" fill="none" stroke="#38464C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<rect x="460" y="292" width="308" height="106" rx="10" fill="#171D20" stroke="#38464C"/>
<text x="614" y="326" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Business decisions</text>
<text x="614" y="368" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="-0.6">Go API</text>
<path d="M614 398 V1152" fill="none" stroke="#38464C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<rect x="830" y="292" width="308" height="106" rx="10" fill="#171D20" stroke="#38464C"/>
<text x="984" y="326" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Durable records</text>
<text x="984" y="368" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="-0.6">PostgreSQL</text>
<path d="M984 398 V1152" fill="none" stroke="#38464C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<rect x="1200" y="292" width="308" height="106" rx="10" fill="#171D20" stroke="#38464C"/>
<text x="1354" y="326" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">External settlement</text>
<text x="1354" y="368" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="-0.6">Payment provider</text>
