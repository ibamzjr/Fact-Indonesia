<text x="88" y="460" fill="#EDC576" font-family="Consolas, monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="1.2">01 / QUOTE &amp; ORDER</text>
<path d="M244 520 H614" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="429.0" y="507" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Request quote + voucher</text>
<path d="M614 580 H984" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="799.0" y="567" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Read current price &amp; voucher rules</text>
<path d="M984 640 H614" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="799.0" y="627" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Calculated price + eligibility</text>
<path d="M244 700 H614" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="429.0" y="687" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Confirm · stable idempotency key</text>
<path d="M614 760 H984" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="799.0" y="747" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Persist pending order + fingerprint</text>
<rect x="64" y="800" width="1472" height="42" rx="4" fill="#29261F" stroke="none"/>
<text x="88" y="828" fill="#EDC576" font-family="Consolas, monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="1.2">02 / PAYMENT HANDOFF</text>
<path d="M614 880 H1354" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="984.0" y="867" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Create intent for the stored order</text>
<path d="M1354 940 H614" fill="none" stroke="#829398" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="984.0" y="927" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Provider reference / checkout URL</text>
<rect x="64" y="978" width="1472" height="42" rx="4" fill="#29261F" stroke="none"/>
<text x="88" y="1006" fill="#EDC576" font-family="Consolas, monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="1.2">03 / VERIFY BEFORE ACCESS</text>
<path d="M1354 1058 H614" fill="none" stroke="#EDC576" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/>
<text x="984.0" y="1045" fill="#EDC576" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Authenticated notification · verify amount</text>
<path d="M614 1120 H984" fill="none" stroke="#EDC576" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/>
<text x="799.0" y="1107" fill="#EDC576" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Atomic: mark paid + grant entitlement</text>
<rect x="88" y="1168" width="1424" height="48" rx="6" fill="#29261F" stroke="#EDC576"/>
<text x="800" y="1199" fill="#EDC576" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="middle">The UI reads Go-owned status. A browser return never grants access.</text>
<path d="M64 1236 H1536" fill="none" stroke="#38464C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="1264" fill="#B7C2C5" font-family="Consolas, monospace" font-size="15" font-weight="500" text-anchor="start" letter-spacing="1.2">DESIGN SEQUENCE / PAYMENT PROVIDER TO BE SELECTED</text>
<text x="1536" y="1264" fill="#B7C2C5" font-family="Consolas, monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="1.2">FACT INDONESIA / 2026</text>
</svg>
