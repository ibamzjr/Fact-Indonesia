<title id="title">FACT Indonesia learning platform architecture</title><desc id="desc">A conceptual system atlas. Next.js experience connects through a Go API to identity, catalogue, orders and entitlements, with PostgreSQL records, public previews and future protected lessons. A separate payment path requires server verification before access. Dashed paths mark future capabilities.</desc>
