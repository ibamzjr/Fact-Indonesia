  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#829398" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#EDC576" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
