<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">FACT Indonesia selected domain relationships</title><desc id="desc">Selected conceptual relationships. Account places order, order contains order items, and course is purchased through order items. Vouchers optionally discount orders. Accounts and courses link to entitlements, courses contain lessons, entitlements and lessons link to progress, and entitlement may earn one certificate. Purchase provenance is explained in the payment sequence. This map is selective rather than a complete deployed schema.</desc>
