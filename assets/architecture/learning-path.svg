<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">FACT Indonesia future learning and certificate path</title><desc id="desc">Future conceptual learning design: signed-in learners need an active entitlement for protected lessons. The server persists progress, evaluates completion policy and may issue a certificate with a verification view. Public previews remain available without entitlement.</desc>
