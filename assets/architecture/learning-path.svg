<text x="88" y="772" fill="#F5F1E8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start">A certificate is an outcome of a defined policy.</text>
<text x="88" y="806" fill="#B7C2C5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Issuance, revocation and verification remain product decisions.</text>
